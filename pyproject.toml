requires-python = "==3.13.*"
dependencies = [
    "arviz==0.22.0",
    "blackjax==1.2.5",
    "folium==0.20.0",
    "gplearn==0.4.2",
    "graphviz==0.21",
    "h5py==3.16.0",
    "ipykernel==6.30.1",
    "ipywidgets==8.1.7",
    "jax==0.7.2",
    "matplotlib==3.10.6",
    "numpy==2.2.6",
    "numpyro==0.19.0",
    "pandas==2.3.2",
    "pymc==5.25.1",
    "pymc-bart==0.11.0",
    "pytensor==2.31.7",
    "scienceplots==2.1.1",
    "scikit-learn==1.6.1",
    "scipy==1.15.3",
    "statsmodels==0.15.0",
    "sympy==1.14.0",
    "xarray==2026.9.0",
